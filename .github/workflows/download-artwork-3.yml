name: Download Botanical Artwork (Pass 5)

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: pip install pillow requests -q

      - name: Download artwork
        run: |
          python3 << 'PYEOF'
          import requests, hashlib, time, os, io, json
          from urllib.parse import quote
          from PIL import Image

          DELAY = 4.0
          HEADERS = {
              'User-Agent': 'GardenCalendarBot/1.0 (https://github.com/nathanieljulien-a11y)',
              'Accept': 'image/jpeg,image/png,image/*',
          }

          def save_image(content, dest):
              img = Image.open(io.BytesIO(content))
              if img.width > 800:
                  h = int(img.height * 800 / img.width)
                  img = img.resize((800, h), Image.LANCZOS)
              if img.mode == 'RGBA': img = img.convert('RGB')
              img.save(dest, 'JPEG', quality=85, optimize=True)
              return os.path.getsize(dest) // 1024

          def wm_url(title):
              # Commons MD5 uses the page title with spaces replaced by underscores
              name = title.replace(' ', '_')
              md5 = hashlib.md5(name.encode('utf-8')).hexdigest()
              a, ab = md5[0], md5[:2]
              enc = quote(name, safe='')
              return f"https://upload.wikimedia.org/wikipedia/commons/{a}/{ab}/{enc}"

          def download_file(title, dest):
              url = wm_url(title)
              for attempt in range(2):
                  try:
                      r = requests.get(url, headers=HEADERS, timeout=25)
                      if r.ok and len(r.content) > 5000:
                          ct = r.headers.get('content-type', '')
                          if 'image' in ct or 'jpeg' in ct:
                              kb = save_image(r.content, dest)
                              return kb
                      if r.status_code == 429:
                          print(f'    429 rate limited, waiting 30s')
                          time.sleep(30)
                  except Exception as e:
                      print(f'    error: {e}')
                  time.sleep(2)
              return None

          def commons_api_find_file(search_term):
              """Find a Commons file title by searching for a term (e.g. POM ID)."""
              url = (
                  'https://commons.wikimedia.org/w/api.php'
                  f'?action=query&list=search&srsearch={quote(search_term)}'
                  '&srnamespace=6&srlimit=3&format=json&origin=*'
              )
              try:
                  r = requests.get(url, headers={'User-Agent': HEADERS['User-Agent']}, timeout=15)
                  data = r.json()
                  hits = data.get('query', {}).get('search', [])
                  if hits:
                      # Strip "File:" prefix
                      return hits[0]['title'].replace('File:', '')
              except Exception as e:
                  print(f'    API error: {e}')
              return None

          os.makedirs('artwork', exist_ok=True)

          # ── 1. Köhler: lemon and rosemary (confirmed plate numbers) ───────────
          # MD5 computed on underscore-normalised title
          KOHLER = {
              'lemon':    'Citrus x limon - Köhler–s Medizinal-Pflanzen-041.jpg',
              'rosemary': 'Rosmarinus officinalis - Köhler–s Medizinal-Pflanzen-258.jpg',
          }
          print('=== Köhler confirmed plates ===')
          for name, title in KOHLER.items():
              dest = f'artwork/{name}.jpg'
              if os.path.exists(dest) and os.path.getsize(dest) > 5000:
                  print(f'  skip {name}'); continue
              time.sleep(DELAY)
              kb = download_file(title, dest)
              if kb:
                  print(f'  OK   {name} ({kb}KB)')
              else:
                  # Try replacing ö and – with ASCII variants
                  alt = title.replace('Köhler', 'Kohler').replace('–', '-')
                  kb = download_file(alt, dest)
                  if kb:
                      print(f'  OK   {name} (alt) ({kb}KB)')
                  else:
                      print(f'  FAIL {name}')

          # ── 2. Fennel: probe Bd.3 plate range with correct MD5 method ────────
          print('\n=== Fennel probe (Bd.3 range, correct MD5) ===')
          dest = 'artwork/fennel.jpg'
          if os.path.exists(dest) and os.path.getsize(dest) > 5000:
              print('  skip fennel')
          else:
              found = False
              for plate in list(range(196, 220)) + list(range(56, 62)):
                  title = f'Foeniculum vulgare - Köhler–s Medizinal-Pflanzen-{plate:03d}.jpg'
                  time.sleep(DELAY)
                  kb = download_file(title, dest)
                  if kb:
                      print(f'  OK   fennel = plate {plate:03d} ({kb}KB)')
                      found = True
                      break
              if not found:
                  print('  MISS fennel')

          # ── 3. USDA Pomological via Commons API lookup ────────────────────────
          # Query Commons API by POM ID → get exact filename → download via CDN
          print('\n=== USDA Pomological (via Commons API) ===')
          USDA = {
              'fig':        'POM00001044',
              'peach':      'POM00001895',
              'strawberry': 'POM00001148',
              'apricot':    'POM00001788',
              'almond':     'POM00001053',
              'mulberry':   'POM00001117',
          }
          for name, pom_id in USDA.items():
              dest = f'artwork/{name}.jpg'
              if os.path.exists(dest) and os.path.getsize(dest) > 5000:
                  print(f'  skip {name}'); continue
              time.sleep(DELAY)
              title = commons_api_find_file(pom_id)
              if not title:
                  print(f'  MISS {name}: no Commons file found for {pom_id}')
                  continue
              print(f'  Found: {title[:70]}')
              time.sleep(DELAY)
              kb = download_file(title, dest)
              if kb:
                  print(f'  OK   {name} ({kb}KB)')
              else:
                  print(f'  FAIL {name}: file found but download failed')

          print('\nPass 5 complete.')
          PYEOF

      - name: Commit
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add artwork/
          git diff --staged --quiet || git commit -m "Botanical artwork pass 5 [automated]"
          git push
