name: Download Botanical Artwork (Pass 9 - sunflower, wisteria, pansy)

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: pip install pillow requests -q

      - name: Download remaining three plants
        run: |
          python3 << 'PYEOF'
          import requests, hashlib, time, os, io
          from urllib.parse import quote
          from PIL import Image

          DELAY = 3.0
          HEADERS = {'User-Agent': 'GardenCalendarBot/1.0 (https://github.com/nathanieljulien-a11y)'}

          def wm_url(title):
              name = title.replace(' ', '_')
              md5  = hashlib.md5(name.encode('utf-8')).hexdigest()
              a, ab = md5[0], md5[:2]
              return f"https://upload.wikimedia.org/wikipedia/commons/{a}/{ab}/{quote(name, safe='')}"

          def save_image(content, dest):
              try:
                  img = Image.open(io.BytesIO(content))
              except Exception as e:
                  print(f'    image decode error: {e}')
                  return None
              if img.width > 800:
                  h = int(img.height * 800 / img.width)
                  img = img.resize((800, h), Image.LANCZOS)
              if img.mode == 'RGBA': img = img.convert('RGB')
              img.save(dest, 'JPEG', quality=85, optimize=True)
              return os.path.getsize(dest) // 1024

          def try_title(title, dest):
              r = requests.get(wm_url(title),
                  headers={**HEADERS, 'Accept': 'image/*'}, timeout=25)
              ct = r.headers.get('content-type', '')
              if r.ok and len(r.content) > 5000 and 'image' in ct:
                  kb = save_image(r.content, dest)
                  if kb: return kb
              return None

          def api_search(query):
              url = (f'https://commons.wikimedia.org/w/api.php'
                     f'?action=query&list=search&srsearch={quote(query)}'
                     f'&srnamespace=6&srlimit=8&format=json&origin=*')
              try:
                  r = requests.get(url, headers=HEADERS, timeout=15)
                  hits = r.json().get('query', {}).get('search', [])
                  return [h['title'].replace('File:', '') for h in hits]
              except Exception as e:
                  print(f'    API error: {e}'); return []

          os.makedirs('artwork', exist_ok=True)

          TARGETS = {
              # Confirmed: wisteria = Bot. Mag. plate 2083
              # The Flickr BHL file for plate 2083 needs its ID — search for it
              'wisteria': [
                  "Curtis's botanical magazine (Plate 2083)",
                  'Wisteria sinensis botanical magazine 2083',
                  'Glycine sinensis botanical magazine 2083',
                  'Wisteria chinensis botanical magazine',
              ],
              # Sunflower: Köhler has Helianthus - try direct plate probe
              # Also try Blackwell Curious Herbal and other sources
              'sunflower': [
                  "Curtis's botanical magazine (Plate 1105)",
                  'Helianthus annuus botanical magazine 1105',
                  'Helianthus annuus Köhler Medizinal-Pflanzen',
                  'Helianthus annuus botanical illustration Blackwell',
                  'Helianthus annuus botanical illustration herbal',
              ],
              # Pansy: the PIL crash suggests the file wasn't a valid image
              # Try different search terms
              'pansy': [
                  'Viola tricolor Blackwell curious herbal illustration',
                  'Viola tricolor botanical illustration herbal',
                  'Viola tricolor botanical magazine illustration',
                  "Curtis's botanical magazine Viola tricolor",
                  'Viola tricolor Köhler Medizinal-Pflanzen',
              ],
          }

          for plant, queries in TARGETS.items():
              dest = f'artwork/{plant}.jpg'
              if os.path.exists(dest) and os.path.getsize(dest) > 5000:
                  print(f'  skip {plant}'); continue

              found = False
              for q in queries:
                  time.sleep(DELAY)
                  hits = api_search(q)
                  # Score hits - prefer botanical illustrations not photos
                  scored = []
                  for h in hits:
                      hl = h.lower()
                      score = 0
                      if any(x in hl for x in ['botanical', 'magazine', 'medizinal',
                                                'herbal', 'illustration', 'köhler',
                                                'blackwell', 'plantarum', 'curtis']): score += 3
                      if any(x in hl for x in ['plate', 'tab']): score += 1
                      if h.lower().endswith(('.jpg','.jpeg','.png')): score += 1
                      if any(x in hl for x in ['photo','garden','park','flower close']): score -= 3
                      scored.append((score, h))
                  scored.sort(reverse=True)
                  for score, title in scored:
                      if score < 1: continue
                      time.sleep(DELAY)
                      kb = try_title(title, dest)
                      if kb:
                          print(f'  OK   {plant} ({kb}KB) <- {title[:70]}')
                          found = True
                          break
                  if found: break

              # Sunflower fallback: try Köhler plate range directly
              if not found and plant == 'sunflower':
                  print(f'  trying Köhler plate probes for sunflower...')
                  for plate in range(50, 70):
                      title = f'Helianthus annuus - K\u00f6hler\u2013s Medizinal-Pflanzen-{plate:03d}.jpg'
                      time.sleep(DELAY)
                      kb = try_title(title, dest)
                      if kb:
                          print(f'  OK   sunflower plate {plate} ({kb}KB)')
                          found = True
                          break

              if not found:
                  print(f'  MISS {plant}')

          print('\nPass 9 complete.')
          PYEOF

      - name: Commit
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add artwork/
          git diff --staged --quiet || git commit -m "Botanical artwork pass 9 (sunflower/wisteria/pansy) [automated]"
          git push
