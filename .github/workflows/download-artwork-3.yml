name: Download Botanical Artwork (Pass 7 - fennel plate 148)

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: pip install pillow requests -q
      - name: Download fennel
        run: |
          python3 << 'PYEOF'
          import requests, hashlib, io, os
          from urllib.parse import quote
          from PIL import Image

          filename = 'Foeniculum vulgare - K\u00f6hler\u2013s Medizinal-Pflanzen-148.jpg'
          name = filename.replace(' ', '_')
          md5  = hashlib.md5(name.encode('utf-8')).hexdigest()
          url  = f"https://upload.wikimedia.org/wikipedia/commons/{md5[0]}/{md5[:2]}/{quote(name, safe='')}"

          r = requests.get(url, headers={'User-Agent': 'GardenCalendarBot/1.0', 'Accept': 'image/*'}, timeout=30)
          if r.ok and len(r.content) > 5000:
              img = Image.open(io.BytesIO(r.content))
              if img.width > 800:
                  h = int(img.height * 800 / img.width)
                  img = img.resize((800, h), Image.LANCZOS)
              if img.mode == 'RGBA': img = img.convert('RGB')
              os.makedirs('artwork', exist_ok=True)
              img.save('artwork/fennel.jpg', 'JPEG', quality=85)
              print(f'OK fennel plate 148 ({os.path.getsize("artwork/fennel.jpg")//1024}KB)')
          else:
              print(f'FAIL: HTTP {r.status_code}')
          PYEOF
      - name: Commit
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add artwork/fennel.jpg
          git diff --staged --quiet || git commit -m "Add fennel artwork Köhler plate 148 [automated]"
          git push
