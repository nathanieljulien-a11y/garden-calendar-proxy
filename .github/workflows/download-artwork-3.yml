name: Download Botanical Artwork (Pass 4 - confirmed filenames)

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install pillow requests -q

      - name: Download artwork with confirmed filenames
        run: |
          python3 << 'PYEOF'
          import requests, hashlib, time, os, io
          from urllib.parse import quote
          from PIL import Image

          DELAY = 5.0  # polite delay between requests

          def wm_url(filename):
              # Wikimedia Commons MD5 hash uses the filename with spaces (not underscores)
              md5 = hashlib.md5(filename.encode('utf-8')).hexdigest()
              a, ab = md5[0], md5[:2]
              enc = quote(filename, safe='')
              return f"https://upload.wikimedia.org/wikipedia/commons/{a}/{ab}/{enc}"

          def try_download(dest, filename):
              headers = {
                  'User-Agent': 'GardenCalendarBot/1.0 (https://github.com/nathanieljulien-a11y)',
                  'Accept': 'image/jpeg,image/png,image/*',
                  'Referer': 'https://commons.wikimedia.org/',
              }
              url = wm_url(filename)
              try:
                  r = requests.get(url, headers=headers, timeout=25)
                  if r.ok and len(r.content) > 5000:
                      img = Image.open(io.BytesIO(r.content))
                      if img.width > 800:
                          h = int(img.height * 800 / img.width)
                          img = img.resize((800, h), Image.LANCZOS)
                      if img.mode == 'RGBA': img = img.convert('RGB')
                      img.save(dest, 'JPEG', quality=85, optimize=True)
                      return True
                  return r.status_code
              except Exception as e:
                  return str(e)

          os.makedirs('artwork', exist_ok=True)

          # ── Section 1: Confirmed Köhler filenames ─────────────────────────────
          # These have been verified from Wikidata and Commons category listings.
          # Key lessons:
          #   - Lemon uses 'x' (plain ASCII), not '×' (U+00D7)
          #   - Spaces in filenames, not underscores, for MD5 hash
          #   - Rosemary is plate 258, not 243 or 250
          #   - Fig, peach, strawberry, almond, apricot, mulberry NOT in Köhler

          KOHLER_CONFIRMED = {
              'lemon':    'Citrus x limon - K\u00f6hler\u2013s Medizinal-Pflanzen-041.jpg',
              'rosemary': 'Rosmarinus officinalis - K\u00f6hler\u2013s Medizinal-Pflanzen-258.jpg',
          }

          # Fennel: confirmed in Köhler but plate number unknown.
          # From category: F plants fall between E (Erythroxylon=199) and G (Gentiana=063).
          # Marrubium=224 (M), so F plants should be ~200-210.
          # Try each individually with the confirmed space-based filename format.
          FENNEL_PROBES = [
              f'Foeniculum vulgare - K\u00f6hler\u2013s Medizinal-Pflanzen-{p:03d}.jpg'
              for p in list(range(196, 213)) + [57, 58, 59, 60]  # also try Bd.1 range
          ]

          print("=== Köhler confirmed plates ===")
          for name, filename in KOHLER_CONFIRMED.items():
              dest = f'artwork/{name}.jpg'
              if os.path.exists(dest) and os.path.getsize(dest) > 5000:
                  print(f'  skip {name} (exists)'); continue
              time.sleep(DELAY)
              result = try_download(dest, filename)
              if result is True:
                  print(f'  OK   {name} ({os.path.getsize(dest)//1024}KB)')
              else:
                  print(f'  FAIL {name}: {result} <- {filename}')

          print("\n=== Fennel probe ===")
          dest = 'artwork/fennel.jpg'
          if os.path.exists(dest) and os.path.getsize(dest) > 5000:
              print(f'  skip fennel (exists)')
          else:
              found = False
              for filename in FENNEL_PROBES:
                  time.sleep(DELAY)
                  result = try_download(dest, filename)
                  if result is True:
                      plate = filename.split('-')[-1].replace('.jpg','')
                      print(f'  OK   fennel = plate {plate} ({os.path.getsize(dest)//1024}KB)')
                      found = True
                      break
                  elif result == 429:
                      print(f'  429  rate limited, stopping')
                      break
              if not found:
                  print(f'  MISS fennel: tried {len(FENNEL_PROBES)} plate numbers')

          # ── Section 2: Alternative sources for fruits not in Köhler ──────────
          # USDA Pomological Watercolor Collection (1886-1942, public domain)
          # These are hosted on the USDA NALDC server.
          # Direct image URL format: https://naldc.nal.usda.gov/download/{id}/PDF
          # But these return PDFs — try the thumbnail endpoint instead.
          # Thumbnail URL: https://naldc.nal.usda.gov/thumbnail/{id}
          # Or the IIIF endpoint: https://naldc.nal.usda.gov/image/{id}/full/800,/0/default.jpg

          USDA = {
              # POM IDs sourced from the NALDC catalogue
              'fig':        'POM00001044',
              'peach':      'POM00001895',
              'strawberry': 'POM00001148',
              'apricot':    'POM00001788',
              'almond':     'POM00001053',
              'mulberry':   'POM00001117',
          }

          USDA_PATTERNS = [
              'https://naldc.nal.usda.gov/image/{id}/full/800,/0/default.jpg',
              'https://naldc.nal.usda.gov/thumbnail/{id}',
              'https://nal.usda.gov/exhibits/speccoll/exhibits/pomological/files/original/{id}.jpg',
          ]

          print("\n=== USDA Pomological Collection ===")
          for name, pom_id in USDA.items():
              dest = f'artwork/{name}.jpg'
              if os.path.exists(dest) and os.path.getsize(dest) > 5000:
                  print(f'  skip {name} (exists)'); continue
              found = False
              headers = {
                  'User-Agent': 'GardenCalendarBot/1.0 (https://github.com/nathanieljulien-a11y)',
                  'Accept': 'image/jpeg,image/png,image/*',
              }
              for pattern in USDA_PATTERNS:
                  url = pattern.format(id=pom_id)
                  time.sleep(DELAY)
                  try:
                      r = requests.get(url, headers=headers, timeout=25, allow_redirects=True)
                      ct = r.headers.get('content-type', '')
                      if r.ok and len(r.content) > 5000 and 'image' in ct:
                          img = Image.open(io.BytesIO(r.content))
                          if img.width > 800:
                              h = int(img.height * 800 / img.width)
                              img = img.resize((800, h), Image.LANCZOS)
                          if img.mode == 'RGBA': img = img.convert('RGB')
                          img.save(dest, 'JPEG', quality=85, optimize=True)
                          print(f'  OK   {name} ({os.path.getsize(dest)//1024}KB) <- {url[:60]}')
                          found = True
                          break
                      else:
                          print(f'  {r.status_code} {name} ct={ct[:30]} <- {url[:50]}')
                  except Exception as e:
                      print(f'  ERR  {name}: {e}')
              if not found:
                  print(f'  MISS {name}: all USDA patterns failed')

          print('\nPass 4 complete.')
          PYEOF

      - name: Commit artwork to repo
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add artwork/
          git diff --staged --quiet || git commit -m "Botanical artwork pass 4 (confirmed filenames + USDA) [automated]"
          git push
