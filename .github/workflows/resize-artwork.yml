name: Resize large artwork files

on:
  push:
    paths:
      - 'artwork/**'

jobs:
  resize:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install sharp
        run: npm install sharp

      - name: Resize artwork files over 1MB
        run: |
          node << 'EOF'
          const sharp = require('sharp');
          const fs    = require('fs');
          const path  = require('path');

          const ARTWORK_DIR  = path.join(process.cwd(), 'artwork');
          const MAX_BYTES    = 1024 * 1024;   // 1MB threshold
          const MAX_WIDTH    = 2000;           // max pixel width
          const MAX_HEIGHT   = 2000;           // max pixel height
          const JPEG_QUALITY = 85;

          async function run() {
            const files = fs.readdirSync(ARTWORK_DIR)
              .filter(f => /\.(jpg|jpeg|png|tiff?|webp)$/i.test(f));

            let resized = 0;
            for (const file of files) {
              const fpath = path.join(ARTWORK_DIR, file);
              const stat  = fs.statSync(fpath);
              if (stat.size <= MAX_BYTES) {
                console.log(`SKIP  ${file} (${Math.round(stat.size/1024)}KB)`);
                continue;
              }
              console.log(`RESIZE ${file} (${Math.round(stat.size/1024)}KB) ...`);
              const buf = fs.readFileSync(fpath);
              const outPath = fpath.replace(/\.[^.]+$/, '.jpg');
              await sharp(buf, { failOn: 'none' })
                .rotate()
                .resize(MAX_WIDTH, MAX_HEIGHT, {
                  fit: 'inside',
                  withoutEnlargement: true,
                })
                .jpeg({ quality: JPEG_QUALITY, mozjpeg: true })
                .toFile(outPath);
              const newSize = fs.statSync(outPath).size;
              console.log(`       → ${Math.round(newSize/1024)}KB (${outPath !== fpath ? 'converted to .jpg' : 'updated in place'})`);
              // Remove original if it was a non-JPEG that got converted
              if (outPath !== fpath) fs.unlinkSync(fpath);
              resized++;
            }
            console.log(`\nDone. ${resized} file(s) resized.`);
          }

          run().catch(e => { console.error(e); process.exit(1); });
          EOF

      - name: Commit resized files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add artwork/
          if git diff --staged --quiet; then
            echo "No changes to commit — all files already within size limit."
          else
            git commit -m "chore: auto-resize artwork files over 1MB [skip ci]"
            git push
          fi
