name: Download Botanical Artwork (Pass 2)

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Pillow
        run: pip install pillow -q

      - name: Download remaining Köhler plates
        run: |
          python3 << 'PYEOF'
          import requests, hashlib, time, sys, os, io
          from urllib.parse import quote
          from PIL import Image

          def url(filename):
              md5 = hashlib.md5(filename.encode('utf-8')).hexdigest()
              a, ab = md5[0], md5[:2]
              enc = quote(filename, safe='')
              return f"https://upload.wikimedia.org/wikipedia/commons/{a}/{ab}/{enc}"

          def kp(species, plate):
              return f"{species}_-_K\u00f6hler\u2013s_Medizinal-Pflanzen-{plate:03d}.jpg"

          # Second pass: corrected filenames for plants that 404'd in pass 1
          # mint needs × (U+00D7) in species name, and olive has plate 229 not 130
          PLATES = {
              'mint':      'Mentha_\u00d7_piperita_-_K\u00f6hler\u2013s_Medizinal-Pflanzen-095.jpg',
              'olive':     kp('Olea_europaea', 229),
              'iris':      'Iris_\u00d7_germanica_-_K\u00f6hler\u2013s_Medizinal-Pflanzen-078.jpg',
              'lemon':     kp('Citrus_limon', 196),
              'rosemary':  kp('Rosmarinus_officinalis', 243),
              'fennel':    kp('Foeniculum_vulgare', 200),
              'fig':       kp('Ficus_carica', 201),
              'peach':     kp('Prunus_persica', 173),
              'strawberry': kp('Fragaria_vesca', 202),
              'almond':    kp('Prunus_dulcis', 172),
              'apricot':   kp('Prunus_armeniaca', 174),
              'mulberry':  kp('Morus_nigra', 228),
          }

          headers = {
              'User-Agent': 'GardenCalendarBot/1.0 (https://github.com/nathanieljulien-a11y; artwork download)',
              'Accept': 'image/jpeg,image/png,image/*',
              'Referer': 'https://commons.wikimedia.org/',
          }

          os.makedirs('artwork', exist_ok=True)
          ok = skip = 0

          for name, filename in PLATES.items():
              dest = f'artwork/{name}.jpg'
              if os.path.exists(dest) and os.path.getsize(dest) > 5000:
                  print(f'  skip {name} (exists)')
                  ok += 1
                  continue

              u = url(filename)
              for attempt in range(3):
                  try:
                      r = requests.get(u, headers=headers, timeout=30)
                      if r.ok and len(r.content) > 5000:
                          img = Image.open(io.BytesIO(r.content))
                          if img.width > 800:
                              h = int(img.height * 800 / img.width)
                              img = img.resize((800, h), Image.LANCZOS)
                          if img.mode == 'RGBA': img = img.convert('RGB')
                          img.save(dest, 'JPEG', quality=85, optimize=True)
                          print(f'  OK   {name} ({os.path.getsize(dest)//1024}KB)')
                          ok += 1
                          break
                      elif r.status_code == 429:
                          print(f'  429  {name} - waiting 20s...')
                          time.sleep(20)
                      elif r.status_code == 404:
                          print(f'  404  {name} - {filename[:60]}')
                          skip += 1
                          break
                      else:
                          print(f'  FAIL {name} HTTP {r.status_code}')
                          break
                  except Exception as e:
                      print(f'  ERR  {name}: {e}')
                  time.sleep(1)

          print(f'\nDone: {ok} OK, {skip} not found')
          PYEOF

      - name: Commit artwork to repo
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add artwork/
          git diff --staged --quiet || git commit -m "Add Köhler botanical artwork plates pass 2 [automated]"
          git push
