          os.makedirs('garden-photos', exist_ok=True)

          ok = skip = miss = 0
          manifest = {}

          for garden in GARDENS:
              fname = safe_filename(garden) + '.jpg'
              dest  = f'garden-photos/{fname}'

              if os.path.exists(dest) and os.path.getsize(dest) > 3000:
                  manifest[garden] = fname
                  skip += 1
                  continue

              time.sleep(DELAY)
              thumb_url = fetch_wikipedia_photo(garden)
              if not thumb_url:
                  print(f'  MISS {garden}')
                  miss += 1
                  continue

              if download_photo(thumb_url, dest):
                  print(f'  OK   {garden} ({os.path.getsize(dest)//1024}KB)')
                  manifest[garden] = fname
                  ok += 1
              else:
                  print(f'  FAIL {garden}')
                  miss += 1

          # Normalise garden name for manifest key — strips accents, lowercases,
          # collapses non-alphanumeric to single space. Must match _normaliseGardenKey
          # in pdfService.js so disk lookups work for accented names.
          import unicodedata
          def normalise_key(name):
              nfd = unicodedata.normalize('NFD', name.lower())
              ascii_only = ''.join(c for c in nfd if unicodedata.category(c) != 'Mn')
              return ' '.join(ascii_only.split())

          manifest_norm = {normalise_key(k): v for k, v in manifest.items()}

          # Save manifest with normalised keys
          with open('garden-photos/manifest.json', 'w') as f:
              json.dump(manifest_norm, f, indent=2)

          print(f'\nDone: {ok} downloaded, {skip} existed, {miss} missing')
          print(f'Manifest: {len(manifest)} entries')
          PYEOF

      - name: Commit garden photos
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add garden-photos/
          git diff --staged --quiet || git commit -m "Pre-fetch garden photos for inspo cards [automated]"
          git push
